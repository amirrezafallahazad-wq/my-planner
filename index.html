<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amirreza's Planner</title>
  <style>
    :root {
      --bg-main: #0a0d14;
      --bg-navbar: #0f141c;
      --bg-dropdown: #1a202c;
      --bg-hover: #2d3748;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --accent-blue: #3b82f6;
      --border-color: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    /* ------------ TOP NAVBAR ------------ */
    .navbar {
      height: 64px;
      background-color: var(--bg-navbar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    /* سمت چپ: عنوان و دکمه‌های کشویی */
    .nav-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-blue);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* هر آیتم منو و Dropdown */
    .dropdown {
      position: relative;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--text-main);
      background-color: var(--bg-hover);
    }

    .nav-btn.active {
      background-color: #1e293b;
      color: var(--accent-blue);
    }

    .arrow-icon {
      font-size: 0.7rem;
      transition: transform 0.2s ease;
    }

    .dropdown.open .arrow-icon {
      transform: rotate(180deg);
    }

    /* محتوای کشویی (Dropdown Menu) */
    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background-color: var(--bg-dropdown);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      min-width: 180px;
      padding: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .dropdown.open .dropdown-menu {
      display: block;
    }

    .dropdown-item {
      display: block;
      padding: 10px 12px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .dropdown-item:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    /* سمت راست هدر (مثلاً دکمه Login یا Profile) */
    .nav-right {
      display: flex;
      align-items: center;
    }

    .login-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover {
      background-color: var(--bg-hover);
    }

    /* ------------ MAIN CONTENT ------------ */
    .main-container {
      padding: 40px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background-color: #111827;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <!-- سمت چپ: برند + دکمه‌ها -->
    <div class="nav-left">
      <a href="#" class="brand-title">Amirreza's Planner</a>

      <nav class="nav-links">
        <!-- Dashboard -->
        <div class="dropdown">
          <button class="nav-btn" onclick="toggleDropdown(this)">
            Dashboard <span class="arrow-icon">▾</span>
          </button>
          <div class="dropdown-menu">
            <a href="#overview" class="dropdown-item">Overview</a>
            <a href="#analytics" class="dropdown-item">Analytics</a>
          </div>
        </div>

        <!-- To-Do -->
        <div class="dropdown">
          <button class="nav-btn" onclick="toggleDropdown(this)">
            To-Do <span class="arrow-icon">▾</span>
          </button>
          <div class="dropdown-menu">
            <a href="#today" class="dropdown-item">Today's Tasks</a>
            <a href="#projects" class="dropdown-item">Projects</a>
            <a href="#archive" class="dropdown-item">Archived</a>
          </div>
        </div>

        <!-- IDP -->
        <div class="dropdown">
          <button class="nav-btn active" onclick="toggleDropdown(this)">
            IDP <span class="arrow-icon">▾</span>
          </button>
          <div class="dropdown-menu">
            <a href="#add-phase" class="dropdown-item">Add IDP Phase</a>
            <a href="#roadmap" class="dropdown-item">Roadmap</a>
          </div>
        </div>
      </nav>
    </div>

    <!-- سمت راست -->
    <div class="nav-right">
      <button class="login-btn">Log in</button>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="main-container">
    <div class="card">
      <h2 style="margin-bottom: 12px;">Add IDP Phase</h2>
      <p style="color: var(--text-muted);">محتوای اصلی برنامه در اینجا قرار می‌گیرد...</p>
    </div>
  </main>

  <script>
    function toggleDropdown(button) {
      const currentDropdown = button.closest('.dropdown');
      
      // بستن بقیه دراپ‌داون‌های باز
      document.querySelectorAll('.dropdown').forEach(d => {
        if (d !== currentDropdown) {
          d.classList.remove('open');
        }
      });

      // باز یا بسته کردن دراپ‌داون کلیک‌شده
      currentDropdown.classList.toggle('open');
    }

    // بستن دراپ‌داون در صورت کلیک روی هر جای دیگر صفحه
    window.addEventListener('click', (e) => {
      if (!e.target.closest('.dropdown')) {
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
      }
    });
  </script>
</body>
</html>
