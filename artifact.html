<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مدیریت پیشرفت | Planner</title>
    <style>
        /* CSS بخش استایل */
        :root { --navy: #1a2a6c; --gold: #d4af37; --bg: #f4f7f6; }
        body { font-family: 'Vazirmatn', sans-serif; background: var(--bg); margin: 0; }
        .navbar { background: var(--navy); color: white; padding: 1rem; display: flex; justify-content: space-between; }
        .view { display: none; padding: 20px; }
        .view.active { display: block; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        button { background: var(--gold); border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

<nav class="navbar">
    <div onclick="showView('dashboard')">🏠 داشبورد</div>
    <div onclick="showView('todo')">📝 تسک‌ها</div>
    <div onclick="showView('idp')">🎯 برنامه IDP</div>
    <button onclick="toggleLang()">FA/EN</button>
</nav>

<!-- ویو داشبورد -->
<div id="dashboard" class="view active">
    <h1>خوش آمدید</h1>
    <div class="card">نمایش آمار و پیشرفت کلی...</div>
</div>

<!-- ویو تسک‌ها -->
<div id="todo" class="view">
    <h1>تسک‌های روزانه</h1>
    <div class="card"><input id="taskInput"><button onclick="addTask()">افزودن</button></div>
    <ul id="taskList"></ul>
</div>

<!-- ویو IDP -->
<div id="idp" class="view">
    <h1>برنامه توسعه فردی (IDP)</h1>
    <div class="card">فرم‌های سافت اسکیل...</div>
</div>

<script>
    // JS بخش منطق
    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        const list = document.getElementById('taskList');
        const li = document.createElement('li');
        li.textContent = input.value;
        list.appendChild(li);
        input.value = '';
    }

    function toggleLang() {
        // منطق تغییر زبان
        const isRtl = document.documentElement.dir === 'rtl';
        document.documentElement.dir = isRtl ? 'ltr' : 'rtl';
        document.documentElement.lang = isRtl ? 'en' : 'fa';
    }
</script>

</body>
</html>
